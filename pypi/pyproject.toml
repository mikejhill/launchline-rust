[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "launchline-rust"
version = "0.3.0"
description = "A lightweight launcher for interactive CLI tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Mike Hill" }]
keywords = ["launcher", "cli", "terminal", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/mikejhill/launchline-rust"
Repository = "https://github.com/mikejhill/launchline-rust"
Issues = "https://github.com/mikejhill/launchline-rust/issues"

[project.scripts]
launchline = "launchline._wrapper:NativeLauncher.main"

[tool.hatch.build.targets.wheel]
packages = ["src/launchline"]

[dependency-groups]
dev = [
    "pexpect>=4.9 ; sys_platform != 'win32'",
    "pytest>=8.3",
    "pywinpty>=3 ; sys_platform == 'win32'",
    "pyyaml>=6.0.3",
    "ruff>=0.15",
    "ty>=0.0.91",
]

[tool.ty.rules]
all = "error"
