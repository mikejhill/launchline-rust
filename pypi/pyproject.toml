[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "launchline"
version = "0.3.0"
description = "A lightweight launcher for interactive CLI tools."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Mike Hill" }]
keywords = ["launcher", "cli", "terminal", "tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/mikejhill/launchline"
Repository = "https://github.com/mikejhill/launchline"
Issues = "https://github.com/mikejhill/launchline/issues"

[project.scripts]
launchline = "launchline:main"

[tool.hatch.build.targets.wheel]
packages = ["src/launchline"]
