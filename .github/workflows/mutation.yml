name: Mutation tests
'on':
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mutation:
    runs-on: windows-latest
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      EXPECTED_REPOSITORY: mikejhill/launchline-rust
    steps:
    - name: Reject non-default manual refs and foreign repositories
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -cne "refs/heads/$env:DEFAULT_BRANCH") { throw 'Default branch required' }
        if ($env:GITHUB_REPOSITORY -cne $env:EXPECTED_REPOSITORY) { throw 'Unexpected repository' }
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      with:
        python-version: '3.13'
    - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
    - run: uv sync --locked --project pypi
    - name: Run scoped seeded mutations
      run: uv run --locked --project pypi python scripts/mutation_ci.py run
    - name: Retain complete or partial execution evidence
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: mutation-results-${{ github.run_id }}-${{ github.run_attempt }}
        path: mutation-results/
        retention-days: 30
        if-no-files-found: warn
