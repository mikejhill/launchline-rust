name: CI
'on':
  workflow_call: null
  workflow_dispatch: null
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
          artifact: launchline-linux-x64
        - os: windows-latest
          target: x86_64-pc-windows-msvc
          artifact: launchline-windows-x64
        - os: macos-latest
          target: aarch64-apple-darwin
          artifact: launchline-macos-arm64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - name: Install pinned Rust toolchain
      run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
    - run: cargo fmt --check
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo test --locked
    - run: cargo build --locked --release
    - name: Build archive target
      shell: bash
      env:
        TARGET: ${{ matrix.target }}
        ARTIFACT: ${{ matrix.artifact }}
      run: cargo build --locked --release --target "$TARGET"
    - name: Verify native archive
      env:
        TARGET: ${{ matrix.target }}
        ARTIFACT: ${{ matrix.artifact }}
      run: uv run --locked --project pypi python scripts/package_binary.py
    - name: Build wrapper distributions
      run: uv build --project pypi --out-dir pypi/dist
    - name: Verify installed wrapper with actual archive
      env:
        TARGET: ${{ matrix.target }}
        ARTIFACT: ${{ matrix.artifact }}
      run: uv run --locked --project pypi python scripts/wrapper_smoke.py
    - name: Format and lint wrapper and tooling
      run: |
        uv run --locked --project pypi ruff format --check pypi/src pypi/tests scripts
        uv run --locked --project pypi ruff check pypi/src pypi/tests scripts
    - name: Check Python wrapper source
      run: uv run --locked --project pypi ty check pypi/src
    - run: cargo package --locked --allow-dirty
    - run: uv run --locked --project pypi --group dev pytest pypi/tests --junitxml=junit.xml
    - run: uv run --project pypi python scripts/mutation_check.py rust
      if: matrix.os == 'windows-latest'
    - name: Wrapper test results
      if: always()
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d
      with:
        report_paths: junit.xml
        annotate_only: true
        check_annotations: false
        require_tests: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: evidence-${{ matrix.os }}
        path: junit.xml
        if-no-files-found: error
    name: Check
