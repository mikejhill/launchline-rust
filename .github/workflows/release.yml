        if __name__ == "__main__":
            CrateUpload.main()

        PY
  source-tag:
    name: Record immutable source version tag
    needs:
    - target
    - crates
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill' && needs.crates.result
      == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Create source tag after verified registry publication
      shell: bash
      env:
        VERSION: ${{ needs.target.outputs.version }}
        TAG: v${{ needs.target.outputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
        ancestor=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .merge_base_commit.sha)
        test "$ancestor" = "$GITHUB_SHA" || { echo 'Release commit is no longer on main.' >&2; exit 1; }
        python3 - <<'PY'
        import json,os,pathlib,re
        assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',os.environ['TAG'])
        assert re.fullmatch(r'[0-9a-f]{40}',os.environ['GITHUB_SHA'])
        pathlib.Path('source-ref.json').write_text(json.dumps({'ref':'refs/tags/'+os.environ['TAG'],'sha':os.environ['GITHUB_SHA']}))
        PY
        if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input source-ref.json >/dev/null 2>tag-create-error.txt; then
          actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          test "$actual" = "$GITHUB_SHA" || { echo 'Conflicting source tag or ref creation failure.' >&2; exit 1; }
        fi
        actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
        test "$actual" = "$GITHUB_SHA" || exit 1
  github-release:
    name: Complete verified GitHub release
    needs:
    - target
    - build
    - crates
    - source-tag
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill' && needs.crates.result
      == 'success' && needs.source-tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build.outputs.artifact-id }}
        path: release
    - name: Reconcile published package, provenance, notes and assets
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.target.outputs.version }}
        SOURCE_SHA: ${{ github.sha }}
        SOURCE_RUN_ID: ${{ github.run_id }}
      run: "python3 - <<'PY'\n\"\"\"Reconcile a GitHub release with an already-published, attested Cargo archive.\"\"\"\n\n\
        from __future__ import annotations\n\nimport hashlib\nimport json\nimport os\nimport re\nimport subprocess\nimport\
        \ tarfile\nimport tempfile\nimport urllib.request\nfrom pathlib import Path\n\n\nclass GitHubRelease:\n    \"\"\"\
        Publish a complete draft only after immutable package and source checks.\"\"\"\n\n    REPO = \"mikejhill/launchline-rust\"\
        \n\n    @staticmethod\n    def gh(*args: str) -> str:\n        \"\"\"Run only explicit GitHub CLI arguments, with\
        \ bounded execution.\"\"\"\n        return subprocess.run(\n            [\"gh\", *args],\n            check=True,\n\
        \            capture_output=True,\n            text=True,\n            encoding=\"utf-8\",\n            timeout=120,\n\
        \        ).stdout\n\n    @classmethod\n    def api(cls, path: str) -> object:\n        \"\"\"Inspect the fixed repository\
        \ without accepting a supplied remote URL.\"\"\"\n        return json.loads(cls.gh(\"api\", f\"repos/{cls.REPO}/{path}\"\
        ))\n\n    @staticmethod\n    def digest(path: Path) -> str:\n        \"\"\"Hash the exact local bytes rather than\
        \ trusting filenames or asset sizes.\"\"\"\n        return hashlib.sha256(path.read_bytes()).hexdigest()\n\n    @classmethod\n\
        \    def prepare(cls, directory: Path) -> tuple[str, str, str, list[Path]]:\n        \"\"\"Require registry checksum,\
        \ exact tag/source and verified build provenance.\"\"\"\n        record = json.loads((directory / \"publish.json\"\
        ).read_text(encoding=\"utf-8\"))\n        version = os.environ[\"VERSION\"]\n        source = record[\"source_sha\"\
        ]\n        if (\n            re.fullmatch(r\"[0-9]+\\.[0-9]+\\.[0-9]+\", version) is None\n            or re.fullmatch(r\"\
        [0-9a-f]{40}\", source) is None\n            or os.environ.get(\"SOURCE_SHA\", source) != source\n            or record[\"\
