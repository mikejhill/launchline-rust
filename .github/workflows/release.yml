name: Release
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release-please:
    name: Review version and changelog
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
      body: ${{ steps.release.outputs.body }}
    steps:
    - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
      id: release
      with:
        token: ${{ github.token }}
        config-file: release-please-config.json
        manifest-file: .release-please-manifest.json
    - name: Validate and approve trusted version-only release PR CI
      if: steps.release.outputs.prs_created == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
        PR_JSON: ${{ steps.release.outputs.pr }}
      run: |
        python3 - <<'PY'
        """Approve only the trusted bot's version-only PR against known read-only CI."""

        from __future__ import annotations

        import base64
        import copy
        import hashlib
        import json
        import os
        import re
        import subprocess
        import time
        import tomllib
        from typing import ClassVar


        class ReleaseCI:
            """Keep unknown authors, source changes and workflow capabilities manual."""

            REPO = "mikejhill/launchline-rust"
            BRANCH = "release-please--branches--main--components--launchline"
            BOT: ClassVar[dict[str, str | int]] = {
                "login": "github-actions[bot]",
                "id": 41898282,
                "type": "Bot",
            }
            CI_SHA256 = "1537005f266d2111e4368bc8c03597ed8a48095f12615972d07b463e1e457c7e"
            FILES: ClassVar[set[str]] = {
                "Cargo.toml",
                "Cargo.lock",
                "CHANGELOG.md",
                ".release-please-manifest.json",
            }

            @staticmethod
            def gh(*args: str) -> str:
                """Use fixed CLI arguments without executing checked-out PR code."""
                return subprocess.run(
                    ["gh", *args],
                    check=True,
                    capture_output=True,
                    text=True,
                    encoding="utf-8",
                    timeout=60,
                ).stdout

            @classmethod
            def api(cls, path: str) -> object:
                """Read only the fixed repository; writes use a separate explicit call."""
                return json.loads(cls.gh("api", f"repos/{cls.REPO}/{path}"))

            @classmethod
            def content(cls, path: str, ref: str) -> bytes:
                """Read immutable blobs via the API, never through a credentialed checkout."""
                record = cls.api(f"contents/{path}?ref={ref}")
                if record["type"] != "file":
                    raise ValueError("Expected a regular metadata file")
                return base64.b64decode(record["content"], validate=False)

            @classmethod
            def identity(cls, number: int) -> dict:
                """Bind the known bot, repository, generated branch and main base."""
                pr = cls.api(f"pulls/{number}")
                if (
                    pr["state"] != "open"
                    or pr["number"] != number
                    or any(pr["user"].get(key) != value for key, value in cls.BOT.items())
                    or pr["head"]["repo"]["full_name"] != cls.REPO
                    or pr["base"]["repo"]["full_name"] != cls.REPO
                    or pr["head"]["repo"]["id"] != pr["base"]["repo"]["id"]
                    or pr["head"]["repo"]["fork"]
                    or pr["head"]["ref"] != cls.BRANCH
                    or pr["base"]["ref"] != "main"
                    or any(
                        re.fullmatch(r"[0-9a-f]{40}", pr[side]["sha"]) is None
                        for side in ("head", "base")
                    )
                ):
                    raise ValueError("Not the trusted same-repository bot release PR")
                return pr

            @classmethod
            def validate(cls, number: int) -> dict:
                """Allow version records only, with unchanged dependencies and pinned CI."""
                pr = cls.identity(number)
                changes = cls.api(f"pulls/{number}/files?per_page=100")
                if (
                    pr["changed_files"] != 4
                    or len(changes) != 4
                    or {item["filename"] for item in changes} != cls.FILES
                    or any(item["status"] != "modified" for item in changes)
                ):
                    raise ValueError("Release PR changes more than the four version files")
                snapshots = {}
                for side in ("base", "head"):
                    ref = pr[side]["sha"]
                    tree = cls.api(f"git/trees/{ref}?recursive=1")
                    if tree.get("truncated"):
                        raise ValueError("Cannot validate a truncated source tree")
                    modes = {item["path"]: item for item in tree["tree"]}
                    for path in cls.FILES | {".github/workflows/ci.yml"}:
                        if modes[path]["type"] != "blob" or modes[path]["mode"] != "100644":
                            raise ValueError("Release metadata/CI must remain regular files")
                    ci = cls.content(".github/workflows/ci.yml", ref)
                    if hashlib.sha256(ci).hexdigest() != cls.CI_SHA256:
                        raise ValueError("CI capabilities changed; review the read-only CI pin")
                    snapshots[side] = {
                        "cargo": tomllib.loads(cls.content("Cargo.toml", ref).decode("utf-8")),
                        "lock": tomllib.loads(cls.content("Cargo.lock", ref).decode("utf-8")),
                        "manifest": json.loads(
                            cls.content(".release-please-manifest.json", ref)
                        ),
                    }
                before, after = snapshots["base"], snapshots["head"]
                old = before["cargo"]["package"]["version"]
                new = after["cargo"]["package"]["version"]
                if (
                    not isinstance(new, str)
                    or re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", new) is None
                    or tuple(map(int, new.split("."))) <= tuple(map(int, old.split(".")))
                    or after["manifest"].get(".") != new
                    or before["manifest"].get(".") != old
                ):
                    raise ValueError("Inconsistent or non-increasing release version")
                normalized = copy.deepcopy(after)
                normalized["cargo"]["package"]["version"] = old
                normalized["manifest"]["."] = old
                roots = [
                    item
                    for item in normalized["lock"]["package"]
                    if item["name"] == "launchline" and "source" not in item
                ]
                if len(roots) != 1 or roots[0]["version"] != new:
                    raise ValueError("Cargo lock root version differs")
                roots[0]["version"] = old
                if normalized != before:
                    raise ValueError("Release PR changes dependencies or non-version metadata")
                return pr

            @classmethod
            def unchanged(cls, number: int, expected: dict) -> None:
                """Reject a head/base race instead of approving a stale validation."""
                current = cls.identity(number)
                if any(
                    current[side]["sha"] != expected[side]["sha"] for side in ("head", "base")
                ):
                    raise ValueError("Release PR source changed during approval")

            @classmethod
            def run_matches(cls, run: dict, pr: dict, workflow_id: int) -> bool:
                """Associate only the known CI's PR-context run with the exact source."""
                return (
                    run["event"] == "pull_request"
                    and run["path"] == ".github/workflows/ci.yml"
                    and run["workflow_id"] == workflow_id
                    and run["head_sha"] == pr["head"]["sha"]
                    and run["repository"]["full_name"] == cls.REPO
                    and run["head_repository"]["full_name"] == cls.REPO
                    and any(
                        item["number"] == pr["number"]
                        and item["head"]["sha"] == pr["head"]["sha"]
                        and item["head"]["repo"]["id"] == pr["head"]["repo"]["id"]
                        for item in run["pull_requests"]
                    )
                    and all(run["actor"].get(key) == value for key, value in cls.BOT.items())
                )

            @classmethod
            def ensure(cls, number: int, attempts: int = 8) -> None:
                """Approve eligible held runs once; otherwise validate the exact known head."""
                pr = cls.validate(number)
                workflow = cls.api("actions/workflows/ci.yml")
                for attempt in range(attempts):
                    runs = cls.api(
                        f"actions/workflows/ci.yml/runs?event=pull_request&head_sha={pr['head']['sha']}&per_page=100"
                    )["workflow_runs"]
                    for candidate in runs:
                        run = cls.api(f"actions/runs/{candidate['id']}")
                        if not cls.run_matches(run, pr, workflow["id"]):
                            continue
                        if run["conclusion"] == "action_required":
                            cls.unchanged(number, pr)
                            fresh = cls.api(f"actions/runs/{run['id']}")
                            if (
                                not cls.run_matches(fresh, pr, workflow["id"])
                                or fresh["conclusion"] != "action_required"
                            ):
                                raise ValueError("Held run changed before approval")
                            cls.gh(
                                "api",
                                "--method",
                                "POST",
                                f"repos/{cls.REPO}/actions/runs/{run['id']}/approve",
                            )
                            print(
                                f"Approved trusted version-only release PR CI run {run['id']} at {pr['head']['sha']}."
                            )
                            return
                        if run["status"] != "completed" or run["conclusion"] == "success":
                            print(
                                f"Exact-head release PR CI run {run['id']} is already active or passed."
                            )
                            return
                        raise RuntimeError(
                            "The exact-head PR-context CI failed; fix it rather than bypassing it"
                        )
                    if attempt + 1 < attempts:
                        time.sleep(5)
                cls.unchanged(number, pr)
                cls.gh(
                    "workflow",
                    "run",
                    "ci.yml",
                    "--repo",
                    cls.REPO,
                    "--ref",
                    cls.BRANCH,
                    "--field",
                    f"expected-sha={pr['head']['sha']}",
                )
                print(
                    "No PR-context run appeared; dispatched unchanged read-only CI with an exact-SHA guard."
                )


        if __name__ == "__main__":
            if os.environ.get("GITHUB_REPOSITORY") != ReleaseCI.REPO:
                raise ValueError("Unexpected repository")
            proposal = json.loads(os.environ["PR_JSON"])
            number = proposal["number"]
            if (
                not isinstance(number, int)
                or number <= 0
                or proposal["headBranchName"] != ReleaseCI.BRANCH
            ):
                raise ValueError("Unexpected release-please PR output")
            ReleaseCI.ensure(number)

        PY
  target:
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill' && needs.release-please.outputs.release_created
      == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes-id: ${{ steps.notes.outputs.artifact-id }}
    steps:
    - name: Validate reviewed release version and retain its notes
      id: version
      env:
        VERSION: ${{ needs.release-please.outputs.version }}
        RELEASE_SOURCE: ${{ needs.release-please.outputs.sha }}
        RELEASE_NOTES: ${{ needs.release-please.outputs.body }}
      run: |
        python3 - <<'PY'
        import os, pathlib, re
        version = os.environ['VERSION']
        if re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version) is None:
            raise ValueError('Invalid reviewed release version')
        if os.environ['RELEASE_SOURCE'] != os.environ['GITHUB_SHA']:
            raise ValueError('Reviewed release source differs from this main commit')
        pathlib.Path('release-changelog.md').write_text(os.environ['RELEASE_NOTES'], encoding='utf-8')
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write(f'version={version}\n')
        PY
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: notes
      with:
        name: release-target-notes
        path: release-changelog.md
        if-no-files-found: error
        retention-days: 7
    name: Target
    needs:
    - release-please
  ci:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
          artifact: launchline-linux-x64
        - os: windows-latest
          target: x86_64-pc-windows-msvc
          artifact: launchline-windows-x64
        - os: macos-latest
          target: aarch64-apple-darwin
          artifact: launchline-macos-arm64
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Validate dispatched source identity
      if: github.event_name == 'workflow_dispatch'
      shell: bash
      env:
        EXPECTED_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [ -n "$EXPECTED_SHA" ]; then
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SHA" = "$GITHUB_SHA" || { echo 'Dispatched branch moved; validate its new head.' >&2; exit 1; }
        fi
    - name: Install pinned Rust toolchain
      run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
    - run: cargo fmt --check
    - run: cargo clippy --locked --all-targets -- -D warnings
    - run: cargo test --locked
    - run: cargo build --locked --release
    - name: Format and lint retained test tooling
      run: |
        uv run --locked --project pypi ruff format --check pypi/src pypi/tests scripts
        uv run --locked --project pypi ruff check pypi/src pypi/tests scripts
    - name: Check Python wrapper source
      run: uv run --locked --project pypi ty check pypi/src
    - name: Build verified Cargo archive
      run: uv run --locked --project pypi python scripts/build_crate.py
    - name: Cargo registry publication dry-run without credentials
      run: cargo publish --dry-run --locked --allow-dirty
    - name: Clean install and test packaged Cargo application
      run: uv run --locked --project pypi python scripts/crate_install_smoke.py
    - run: uv run --project pypi python scripts/mutation_check.py rust
      if: matrix.os == 'windows-latest'
    - name: Check seeded menu mutations
      run: uv run --locked --project pypi python scripts/mutate_menus.py rust
      if: matrix.os == 'windows-latest'
    - name: Native installed-package and policy test results
      if: always()
      uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d
      with:
        report_paths: junit.xml
        annotate_only: true
        check_annotations: false
        require_tests: true
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: evidence-${{ matrix.os }}
        path: |-
          junit.xml
          docs/validation/*json
        if-no-files-found: error
    name: Check
  build:
    name: Build tested crate without publishing credentials
    needs:
    - target
    - ci
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill' && needs.target.outputs.version
      != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.crate.outputs.artifact-id }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.target.outputs.notes-id }}
        path: release-target
    - name: Retain generated notes inside the crate
      run: cp release-target/release-changelog.md release-changelog.md
    - name: Install pinned Rust toolchain
      run: rustup toolchain install 1.99.1 --profile minimal
    - name: Set ephemeral Cargo release version
      env:
        VERSION: ${{ needs.target.outputs.version }}
      run: uv run --locked --project pypi python scripts/set_release_version.py
    - name: Build exact crate and registry metadata
      env:
        SOURCE_SHA: ${{ github.sha }}
      run: uv run --locked --project pypi python scripts/build_crate.py
    - name: Verify clean installed release crate
      run: uv run --locked --project pypi python scripts/crate_install_smoke.py --terminal-only
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      id: crate
      with:
        name: trusted-crate
        path: crate-release/*
        if-no-files-found: error
        retention-days: 7
  attest:
    name: Attest tested crate
    needs: build
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill' && needs.build.result
      == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build.outputs.artifact-id }}
        path: release
    - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
      with:
        subject-path: |-
          release/*.crate
          release/publish.json
  crates:
    name: Publish exact tested crate to crates.io
    needs:
    - target
    - build
    - attest
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill' && needs.build.result
      == 'success' && needs.attest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build.outputs.artifact-id }}
        path: release
    - name: Validate source ancestry and immutable tag boundary
      shell: bash
      env:
        VERSION: ${{ needs.target.outputs.version }}
        TAG: v${{ needs.target.outputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
        ancestor=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .merge_base_commit.sha)
        test "$ancestor" = "$GITHUB_SHA" || { echo 'Release commit is no longer on main.' >&2; exit 1; }
        existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq 'map(select(.ref == ("refs/tags/" + env.TAG)))[0].object.sha // ""')
        test -z "$existing" || test "$existing" = "$GITHUB_SHA" || { echo 'Conflicting source tag exists.' >&2; exit 1; }
    - name: Validate artifact before requesting credentials
      env:
        VERSION: ${{ needs.target.outputs.version }}
        TAG: v${{ needs.target.outputs.version }}
        CRATE_VERIFY_ONLY: '1'
      run: |
        python3 - <<'PY'
        """Publish one verified, prebuilt Cargo archive without building or executing it."""

        from __future__ import annotations

        import hashlib
        import json
        import os
        import re
        import struct
        import sys
        import time
        import urllib.error
        import urllib.request
        from pathlib import Path


        class NoRedirect(urllib.request.HTTPRedirectHandler):
            """Never forward a registry credential through a redirect."""

            def redirect_request(self, *_args: object, **_kwargs: object) -> None:
                """Reject redirects rather than broadening the credential destination."""
                return


        class CrateUpload:
            """Use Cargo's documented upload protocol with a fixed registry destination."""

            API = "https://crates.io/api/v1/crates"

            @staticmethod
            def bundle(directory: Path) -> tuple[dict[str, object], bytes, str]:
                """Require the expected crate, version, digest and reviewed source SHA."""
                record = json.loads((directory / "publish.json").read_text(encoding="utf-8"))
                version = os.environ["VERSION"]
                source = os.environ["GITHUB_SHA"]
                if (
                    re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None
                    or re.fullmatch(r"[0-9a-f]{40}", source) is None
                ):
                    raise ValueError("Invalid release identity")
                package = record["package"]
                if (
                    package["name"] != "launchline"
                    or package["vers"] != version
                    or record["source_sha"] != source
                ):
                    raise ValueError("Release identity does not match reviewed source")
                filename = f"launchline-{version}.crate"
                if record["crate_file"] != filename:
                    raise ValueError("Unexpected crate filename")
                path = directory / filename
                if not 0 < path.stat().st_size <= 10 * 1024 * 1024:
                    raise ValueError("Crate exceeds registry size boundary")
                payload = path.read_bytes()
                digest = hashlib.sha256(payload).hexdigest()
                if (
                    digest != record["sha256"]
                    or package.get("repository")
                    != "https://github.com/mikejhill/launchline-rust"
                ):
                    raise ValueError("Artifact checksum or repository mismatch")
                return package, payload, digest

            @staticmethod
            def _existing(version: str) -> str | None:
                """Return only the public registry checksum; distinguish 404 from failures."""
                request = urllib.request.Request(
                    f"{CrateUpload.API}/launchline/{version}",
                    headers={
                        "User-Agent": "launchline-release/1 (github.com/mikejhill/launchline-rust)"
                    },
                )
                try:
                    with urllib.request.build_opener(NoRedirect()).open(
                        request, timeout=30
                    ) as response:
                        return str(json.load(response)["version"]["checksum"])
                except urllib.error.HTTPError as error:
                    if error.code == 404:
                        return None
                    raise RuntimeError(
                        f"Registry inspection failed (HTTP {error.code})"
                    ) from None

            @staticmethod
            def publish(directory: Path) -> None:
                """Upload once or accept an exact-checksum retry; never overwrite a version."""
                package, payload, digest = CrateUpload.bundle(directory)
                version = str(package["vers"])
                existing = CrateUpload._existing(version)
                if existing is not None:
                    if existing != digest:
                        raise ValueError("Existing registry version has different bytes")
                    sys.stdout.write("Registry already contains the exact tested crate.\n")
                    return
                metadata = json.dumps(package, separators=(",", ":")).encode()
                body = (
                    struct.pack("<I", len(metadata))
                    + metadata
                    + struct.pack("<I", len(payload))
                    + payload
                )
                request = urllib.request.Request(
                    CrateUpload.API + "/new",
                    data=body,
                    method="PUT",
                    headers={
                        "Authorization": os.environ["CRATES_IO_TOKEN"],
                        "Content-Type": "application/octet-stream",
                        "Accept": "application/json",
                        "User-Agent": "launchline-release/1 (github.com/mikejhill/launchline-rust)",
                    },
                )
                try:
                    with urllib.request.build_opener(NoRedirect()).open(
                        request, timeout=60
                    ) as response:
                        result = json.load(response)
                        if result.get("errors"):
                            raise RuntimeError("Registry rejected the upload")
                except (urllib.error.URLError, TimeoutError) as error:
                    raise RuntimeError(
                        "Upload outcome uncertain; inspect exact version/checksum before retry"
                    ) from error
                for _attempt in range(12):
                    existing = CrateUpload._existing(version)
                    if existing is not None:
                        if existing != digest:
                            raise ValueError("Published checksum differs from tested artifact")
                        sys.stdout.write("Published exact tested crate to crates.io.\n")
                        return
                    time.sleep(5)
                raise RuntimeError(
                    "Upload accepted but visibility unconfirmed; inspect before retry"
                )

            @staticmethod
            def main() -> None:
                """Validate without credentials, or publish the same already-tested archive."""
                directory = Path("release")
                if os.environ.get("CRATE_VERIFY_ONLY") == "1":
                    CrateUpload.bundle(directory)
                    sys.stdout.write("Verified crate release bundle.\n")
                else:
                    CrateUpload.publish(directory)


        if __name__ == "__main__":
            CrateUpload.main()

        PY
    - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9
      id: auth
    - name: Publish prebuilt archive without executing package code
      env:
        VERSION: ${{ needs.target.outputs.version }}
        TAG: v${{ needs.target.outputs.version }}
        CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
      run: |
        python3 - <<'PY'
        """Publish one verified, prebuilt Cargo archive without building or executing it."""

        from __future__ import annotations

        import hashlib
        import json
        import os
        import re
        import struct
        import sys
        import time
        import urllib.error
        import urllib.request
        from pathlib import Path


        class NoRedirect(urllib.request.HTTPRedirectHandler):
            """Never forward a registry credential through a redirect."""

            def redirect_request(self, *_args: object, **_kwargs: object) -> None:
                """Reject redirects rather than broadening the credential destination."""
                return


        class CrateUpload:
            """Use Cargo's documented upload protocol with a fixed registry destination."""

            API = "https://crates.io/api/v1/crates"

            @staticmethod
            def bundle(directory: Path) -> tuple[dict[str, object], bytes, str]:
                """Require the expected crate, version, digest and reviewed source SHA."""
                record = json.loads((directory / "publish.json").read_text(encoding="utf-8"))
                version = os.environ["VERSION"]
                source = os.environ["GITHUB_SHA"]
                if (
                    re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None
                    or re.fullmatch(r"[0-9a-f]{40}", source) is None
                ):
                    raise ValueError("Invalid release identity")
                package = record["package"]
                if (
                    package["name"] != "launchline"
                    or package["vers"] != version
                    or record["source_sha"] != source
                ):
                    raise ValueError("Release identity does not match reviewed source")
                filename = f"launchline-{version}.crate"
                if record["crate_file"] != filename:
                    raise ValueError("Unexpected crate filename")
                path = directory / filename
                if not 0 < path.stat().st_size <= 10 * 1024 * 1024:
                    raise ValueError("Crate exceeds registry size boundary")
                payload = path.read_bytes()
                digest = hashlib.sha256(payload).hexdigest()
                if (
                    digest != record["sha256"]
                    or package.get("repository")
                    != "https://github.com/mikejhill/launchline-rust"
                ):
                    raise ValueError("Artifact checksum or repository mismatch")
                return package, payload, digest

            @staticmethod
            def _existing(version: str) -> str | None:
                """Return only the public registry checksum; distinguish 404 from failures."""
                request = urllib.request.Request(
                    f"{CrateUpload.API}/launchline/{version}",
                    headers={
                        "User-Agent": "launchline-release/1 (github.com/mikejhill/launchline-rust)"
                    },
                )
                try:
                    with urllib.request.build_opener(NoRedirect()).open(
                        request, timeout=30
                    ) as response:
                        return str(json.load(response)["version"]["checksum"])
                except urllib.error.HTTPError as error:
                    if error.code == 404:
                        return None
                    raise RuntimeError(
                        f"Registry inspection failed (HTTP {error.code})"
                    ) from None

            @staticmethod
            def publish(directory: Path) -> None:
                """Upload once or accept an exact-checksum retry; never overwrite a version."""
                package, payload, digest = CrateUpload.bundle(directory)
                version = str(package["vers"])
                existing = CrateUpload._existing(version)
                if existing is not None:
                    if existing != digest:
                        raise ValueError("Existing registry version has different bytes")
                    sys.stdout.write("Registry already contains the exact tested crate.\n")
                    return
                metadata = json.dumps(package, separators=(",", ":")).encode()
                body = (
                    struct.pack("<I", len(metadata))
                    + metadata
                    + struct.pack("<I", len(payload))
                    + payload
                )
                request = urllib.request.Request(
                    CrateUpload.API + "/new",
                    data=body,
                    method="PUT",
                    headers={
                        "Authorization": os.environ["CRATES_IO_TOKEN"],
                        "Content-Type": "application/octet-stream",
                        "Accept": "application/json",
                        "User-Agent": "launchline-release/1 (github.com/mikejhill/launchline-rust)",
                    },
                )
                try:
                    with urllib.request.build_opener(NoRedirect()).open(
                        request, timeout=60
                    ) as response:
                        result = json.load(response)
                        if result.get("errors"):
                            raise RuntimeError("Registry rejected the upload")
                except (urllib.error.URLError, TimeoutError) as error:
                    raise RuntimeError(
                        "Upload outcome uncertain; inspect exact version/checksum before retry"
                    ) from error
                for _attempt in range(12):
                    existing = CrateUpload._existing(version)
                    if existing is not None:
                        if existing != digest:
                            raise ValueError("Published checksum differs from tested artifact")
                        sys.stdout.write("Published exact tested crate to crates.io.\n")
                        return
                    time.sleep(5)
                raise RuntimeError(
                    "Upload accepted but visibility unconfirmed; inspect before retry"
                )

            @staticmethod
            def main() -> None:
                """Validate without credentials, or publish the same already-tested archive."""
                directory = Path("release")
                if os.environ.get("CRATE_VERIFY_ONLY") == "1":
                    CrateUpload.bundle(directory)
                    sys.stdout.write("Verified crate release bundle.\n")
                else:
                    CrateUpload.publish(directory)


        if __name__ == "__main__":
            CrateUpload.main()

        PY
  source-tag:
    name: Record immutable source version tag
    needs:
    - target
    - crates
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill' && needs.crates.result
      == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - name: Create source tag after verified registry publication
      shell: bash
      env:
        VERSION: ${{ needs.target.outputs.version }}
        TAG: v${{ needs.target.outputs.version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
        ancestor=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" --jq .merge_base_commit.sha)
        test "$ancestor" = "$GITHUB_SHA" || { echo 'Release commit is no longer on main.' >&2; exit 1; }
        python3 - <<'PY'
        import json,os,pathlib,re
        assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',os.environ['TAG'])
        assert re.fullmatch(r'[0-9a-f]{40}',os.environ['GITHUB_SHA'])
        pathlib.Path('source-ref.json').write_text(json.dumps({'ref':'refs/tags/'+os.environ['TAG'],'sha':os.environ['GITHUB_SHA']}))
        PY
        if ! gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --input source-ref.json >/dev/null 2>tag-create-error.txt; then
          actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          test "$actual" = "$GITHUB_SHA" || { echo 'Conflicting source tag or ref creation failure.' >&2; exit 1; }
        fi
        actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
        test "$actual" = "$GITHUB_SHA" || exit 1
  github-release:
    name: Complete verified GitHub release
    needs:
    - target
    - build
    - crates
    - source-tag
    if: github.ref == 'refs/heads/main' && github.actor == 'mikejhill' && github.triggering_actor == 'mikejhill' && needs.crates.result
      == 'success' && needs.source-tag.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: read
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        artifact-ids: ${{ needs.build.outputs.artifact-id }}
        path: release
    - name: Reconcile published package, provenance, notes and assets
      env:
        GH_TOKEN: ${{ github.token }}
