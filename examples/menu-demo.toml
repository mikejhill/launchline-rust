# In any submenu, press 0 to go Back one level; Ctrl+C quits globally.
[settings]
title = "LaunchLine"

[[entries]]
name = "GitHub Copilot CLI"
command = "ghcs"
description = "AI-powered CLI assistant"

[[entries]]
name = "PowerShell"
command = "pwsh"
description = "PowerShell 7"

[[entries]]
name = "Python"
command = "python"
description = "Python 3.13 REPL"

[[entries]]
name = "Node.js"
command = "node"
description = "Node.js REPL"

[[entries]]
name = "Docker Desktop"
command = "docker"
description = "Manage containers"

[[entries]]
name = "Git Bash"
command = "bash"
description = "Git for Windows shell"

[[entries]]
name = "Development"
description = "Static submenu"
[entries.menu]
title = "Development tools"
[[entries.menu.entries]]
name = "Git version"
command = "git"
args = ["--version"]
description = "Installed Git version"

[[entries.menu.entries]]
name = "Python version"
command = "python"
args = ["--version"]
description = "Installed Python version"

[[entries.menu.entries]]
name = "Run tests"
command = "python"
args = ["-m", "pytest"]
description = "Project test suite"

[[entries]]
id = "projects"
name = "Projects"
description = "Generated on first visit"
[entries.menu]
title = "Project tools"
refresh_on_return = true
[entries.menu.provider]
command = "python"
args = ["examples/menu_provider.py"]
timeout_seconds = 10
